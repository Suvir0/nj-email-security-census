[project]
name = "nj-email-security-census"
version = "0.1.0"
description = "Passive, DNS-only survey of NJ public school districts' email authentication posture"
requires-python = ">=3.11"
dependencies = [
    "dnspython>=2.7",
    "requests>=2.32",
    "tldextract>=5.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
